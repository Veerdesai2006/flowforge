{% extends "base.html" %}

<!-- ====================================================== -->
<!-- Page Title -->
<!-- ====================================================== -->

{% block title %}

Register | FlowForge

{% endblock %}

<!-- ====================================================== -->
<!-- Page Content -->
<!-- ====================================================== -->

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg border-0">

            <div class="card-body p-5">

                <!-- Heading -->

                <h2 class="text-center fw-bold mb-2">

                    Create Your Account 🚀

                </h2>

                <p class="text-center text-muted mb-4">

                    Start managing your projects with FlowForge

                </p>

                <!-- Registration Form -->

                <form id="registerForm">

                    <!-- First Name -->

                    <div class="mb-3">

                        <label class="form-label">

                            First Name

                        </label>

                        <input
                            type="text"
                            id="first_name"
                            class="form-control"
                            placeholder="Enter first name"
                            required>

                    </div>

                    <!-- Last Name -->

                    <div class="mb-3">

                        <label class="form-label">

                            Last Name

                        </label>

                        <input
                            type="text"
                            id="last_name"
                            class="form-control"
                            placeholder="Enter last name"
                            required>

                    </div>

                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create a password"
                            required>

                    </div>

                    <!-- Confirm Password -->

                    <div class="mb-4">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            class="form-control"
                            placeholder="Confirm your password"
                            required>

                    </div>

                    <!-- Register Button -->

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        Create Account

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    Already have an account?

                    <a href="/login">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

<!-- ====================================================== -->
<!-- JavaScript -->
<!-- ====================================================== -->

{% block scripts %}

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event){

        /*
            Prevent browser refresh.

            Later we'll call

            POST /api/auth/register

            using JavaScript fetch().
        */

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm_password").value;

        // Basic client-side validation
        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }

        console.log("Registration form submitted.");

    });

</script>

{% endblock %}
