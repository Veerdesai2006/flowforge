<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ====================================================== -->
    <!-- Basic Meta -->
    <!-- ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            FlowForge
        {% endblock %}
    </title>

    <!-- ====================================================== -->
    <!-- Bootstrap 5 CSS -->
    <!-- ====================================================== -->

    <!--
        Bootstrap gives us ready-made UI components.

        Examples:
            Buttons
            Cards
            Navbar
            Tables
            Grid System
            Forms
            Alerts
    -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ====================================================== -->
    <!-- Bootstrap Icons -->
    <!-- ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- ====================================================== -->
    <!-- Our CSS -->
    <!-- ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}">

</head>

<body class="bg-light">

<!-- ====================================================== -->
<!-- Navbar -->
<!-- ====================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/">

            FlowForge

        </a>

    </div>

</nav>

<!-- ====================================================== -->
<!-- Main Container -->
<!-- ====================================================== -->

<div class="container mt-5">

    <!--
        Every child page will insert its HTML here.
    -->

    {% block content %}

    {% endblock %}

</div>

<!-- ====================================================== -->
<!-- Bootstrap JS -->
<!-- ====================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<!-- ====================================================== -->
<!-- Our JavaScript -->
<!-- ====================================================== -->

<script
src="{{ url_for('static', path='js/app.js') }}">
</script>

<!-- ====================================================== -->
<!-- Additional JS Block -->
<!-- ====================================================== -->

{% block scripts %}

{% endblock %}

</body>

</html>
